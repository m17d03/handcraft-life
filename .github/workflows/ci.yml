# Prüft jeden Push und Pull Request: Typen, Lint, Unit-Tests und Playwright-Tests
# in WebKit mit iPhone-Profil (die Cloud-Sitzung kann WebKit nicht laden – hier läuft es echt).
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      # WebKit-Download war mehrfach unzuverlässig (hing 40 min bzw. scheiterte) → Browser zwischenspeichern
      # (Schlüssel = Playwright-Version).
      - name: Playwright-Version ermitteln
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: WebKit aus dem Zwischenspeicher
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-webkit-${{ runner.os }}-${{ steps.pw.outputs.version }}
      # Systempakete (apt) laden zeitweise > 5 min: keine innere Zeitgrenze (ein abgebrochenes apt-get hielt die
      # dpkg-Sperre und liess jeden Wiederholungsversuch scheitern), nur die Schritt-Grenze. Wiederholt wird nur
      # der Browser-Download, der bei Treffer im Zwischenspeicher entfällt.
      - name: WebKit-Systempakete installieren
        timeout-minutes: 20
        run: npx playwright install-deps webkit
      - name: WebKit installieren
        if: steps.pw-cache.outputs.cache-hit != 'true'
        timeout-minutes: 12
        run: |
          for versuch in 1 2 3; do
            timeout 240 npx playwright install webkit && exit 0
            echo "Versuch $versuch fehlgeschlagen, neuer Versuch in 20 s"; sleep 20
          done
          exit 1
      - id: e2e
        run: npm run test:e2e
      # Ticket 015: Performance-Budget in WebKit (iPhone 15 quer, tests/perf/budget.spec.ts). Läuft auch nach roten
      # E2E-Tests, damit die Messwerte sichtbar sind. Rot bei harter Grenze (Draw Calls, Dreiecke, Texturspeicher,
      # Download) und bei Messfehler (z. B. 0 Draw Calls = Szene nicht gezeichnet). Test-Zeitlimit 6 min (budget.config.ts).
      - name: Performance-Budget (WebKit)
        id: perf
        if: ${{ !cancelled() && steps.e2e.outcome != 'skipped' }}
        timeout-minutes: 8
        run: npx playwright test -c tests/perf/budget.config.ts
      - name: Performance-Bericht in die Zusammenfassung
        if: ${{ !cancelled() && steps.perf.outcome != 'skipped' }}
        run: |
          if [ -f test-results/perf-budget/budget.md ]; then
            cat test-results/perf-budget/budget.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## Performance-Budget – kein Bericht (Messung abgebrochen, siehe Log des Schritts)" >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && steps.perf.outcome != 'skipped' }}
        with:
          name: perf-budget
          path: test-results/perf-budget/
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7
