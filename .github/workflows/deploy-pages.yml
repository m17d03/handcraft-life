# Baut das Spiel bei jedem Push auf main und veröffentlicht es auf GitHub Pages,
# damit es auf dem iPhone per Link getestet werden kann.
# Läuft erst, sobald es eine package.json gibt (ab Phase S).
# Voraussetzung: Repo Settings → Pages → Source: "GitHub Actions".
# Hinweis: Pages für private Repos braucht GitHub Pro; sonst Repo öffentlich machen.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: ${{ hashFiles('package.json') != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build -- --base=/${{ github.event.repository.name }}/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
