<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#1f1a15" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>HUD-Testseite – Handcraft Life</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #1f1a15; overscroll-behavior: none; }
      /* Platzhalter für den Canvas: keine 3D-Darstellung, nur damit Umschauen/Gehen sichtbar ist. */
      #szene {
        position: fixed; inset: 0;
        background:
          linear-gradient(180deg, transparent 0 62%, #3b2a1c 62% 63%, #5a4330 63% 100%),
          repeating-linear-gradient(90deg, #4a3624 0 58px, #42301f 58px 60px, #4d3927 60px 120px);
      }
      #brett {
        position: fixed; left: 10%; right: 10%; top: 46%; height: 56px; border-radius: 4px;
        background: linear-gradient(180deg, #f0d2a4, #d9b07a 40%, #b98a55); box-shadow: 0 10px 18px rgb(0 0 0 / 40%);
      }
      #kennung {
        position: fixed; left: 50%; top: 40%; transform: translateX(-50%); z-index: 1; pointer-events: none;
        font: 600 15px -apple-system, BlinkMacSystemFont, sans-serif; color: #1f1a15; background: #d9a35b;
        padding: 3px 10px; border-radius: 6px; white-space: nowrap;
      }
      #log {
        position: fixed; z-index: 50; left: 50%; bottom: 80px; transform: translateX(-50%); margin: 0; pointer-events: none;
        font: 15px ui-monospace, Menlo, monospace; color: #f3e9dc; background: rgb(0 0 0 / 70%); padding: 6px 10px;
        border-radius: 8px; max-width: 60vw; white-space: pre; overflow: hidden;
      }
      #log[hidden], #brett[hidden] { display: none; }
    </style>
  </head>
  <body>
    <div id="szene"></div>
    <div id="brett" hidden></div>
    <div id="kennung">HUD-Testseite – keine 3D-Darstellung, Fake-Werte</div>
    <pre id="log" hidden></pre>
    <script type="module" src="../src/hud-demo/main.ts"></script>
  </body>
</html>
